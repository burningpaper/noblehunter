[project]
name = "noble-hunter"
version = "0.1.0"
description = "Finds Spotify playlist curators worth pitching, with a web app to manage artist profiles."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies for the Vercel web app ONLY. Vercel installs these.
# Keep the pipeline's heavy dependencies (Playwright) in the `pipeline` group below.
dependencies = [
    "authlib>=1.6",
    "fastapi>=0.117.1",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2.10",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.43",
]

[dependency-groups]
dev = [
    "alembic>=1.16",
    "httpx>=0.28",
    "pytest>=8.4",
    "pyyaml>=6.0.2",
    "ruff>=0.13",
    "typer>=0.17",
    "uvicorn>=0.35",
]
pipeline = [
    "alembic>=1.16",
    "anthropic>=1.5.0",
    "httpx>=0.28",
    "playwright>=1.55",
    "pyyaml>=6.0.2",
    "typer>=0.17",
]

[tool.vercel]
entrypoint = "web.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits real external services; run with --run-live"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
