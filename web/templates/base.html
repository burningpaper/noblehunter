<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  {# includeIndicatorStyles: htmx would otherwise inject an inline <style>, which our CSP blocks.
     responseHandling: swap 422 fragments too, so validation messages appear where they belong. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "422", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <title>{% block title %}Noble Hunter{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  {# Here rather than on one page: any page may render a <time>, and the pitch panel that renders
     them appears on both the digest and the Inbox. A file, not an inline script, because our CSP
     is script-src 'self'. It listens for htmx's events but never touches the htmx global, so it
     doesn't care that defer runs it second. #}
  <script src="/static/js/localtime.js" defer></script>
</head>
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Noble Hunter home">
      <span class="wordmark__mark" aria-hidden="true"></span>
      Noble Hunter
    </a>
    {% if current_user %}
    <nav class="site-nav" aria-label="Main">
      <a class="site-nav__link" href="/digest">Digest</a>
      <a class="site-nav__link" href="/inbox">Inbox</a>
      <a class="site-nav__link" href="/profiles">Profiles</a>
      {% if is_admin %}<a class="site-nav__link" href="/people">People</a>{% endif %}
      <span class="user-chip">
        {% if current_user.picture %}
        <img class="user-chip__avatar" src="{{ current_user.picture }}" alt="" width="24" height="24" referrerpolicy="no-referrer">
        {% else %}
        <span class="user-chip__avatar user-chip__avatar--initial" aria-hidden="true">{{ current_user.email[:1] | upper }}</span>
        {% endif %}
        <span class="user-chip__email">{{ current_user.email }}</span>
      </span>
      <button class="button button--ghost" type="button" hx-post="/logout">
        Sign out
        <span class="htmx-indicator spinner" aria-hidden="true"></span>
      </button>
    </nav>
    {% endif %}
  </header>
  <main id="main" class="page" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
