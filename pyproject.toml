[project]
name = "noble-hunter"
version = "0.1.0"
description = "Finds Spotify playlist curators worth pitching, with a web app to manage artist profiles."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies for the Vercel web app ONLY. Vercel installs these.
# Keep the pipeline's heavy dependencies (Playwright) in the `pipeline` group below.
dependencies = [
    "fastapi>=0.117.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.13",
    "uvicorn>=0.35",
]
pipeline = [
    "httpx>=0.28",
    "playwright>=1.55",
]

[tool.vercel]
entrypoint = "web.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
